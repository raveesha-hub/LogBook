<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Log Book</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b3a;--mute:#6b6890;--bg:#f4f1ff;--line:#e6e1fb;--c1:#6c4cf5;--c2:#ff5c8a;--c3:#00b8a9;--c4:#ffb020;--c5:#2f8cff}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 8% 0,#ffd9e6 0,transparent 34%),radial-gradient(circle at 95% 8%,#cfe6ff 0,transparent 32%),radial-gradient(circle at 60% 100%,#c9f5ee 0,transparent 35%);background-attachment:fixed;min-height:100vh;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c5);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--c1)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;cursor:pointer;border-radius:12px;padding:11px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(108,76,245,.3)}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--c1);box-shadow:none;border:2px solid var(--line)}
.btn.teal{background:linear-gradient(135deg,var(--c3),var(--c5))}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px;box-shadow:none}
.btn.danger{background:#fff;color:#d6204f;border:2px solid #ffd3de;box-shadow:none}
.link{background:none;border:0;color:var(--c1);font-weight:700;cursor:pointer;padding:0}
.err{color:#d6204f;font-size:14px;min-height:20px;margin-top:8px}
.note{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px;color:#6b4a00}
#auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.authbox{width:100%;max-width:410px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(108,76,245,.25);border-top:8px solid var(--c1)}
.authbox h1{margin:0 0 4px;font-size:30px;font-weight:800}
.authbox p{margin:0 0 14px;color:var(--mute)}
.full{width:100%;margin-top:16px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:22px 24px;border-radius:26px;color:#fff;background:linear-gradient(120deg,var(--c1) 0%,var(--c2) 55%,var(--c4) 100%);box-shadow:0 14px 40px rgba(108,76,245,.3)}
header.top h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.1}
header.top p{margin:2px 0 0;opacity:.92}
.who{display:flex;align-items:center;gap:10px}
.who .btn{background:rgba(255,255,255,.22);box-shadow:none}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 22px rgba(30,27,58,.07);border-left:8px solid var(--sc)}
.stat b{font-size:28px;font-weight:800;display:block;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:700;cursor:pointer;color:var(--mute)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr;gap:10px;align-items:end;background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px rgba(30,27,58,.06)}
.filters label{margin:0 0 3px;font-size:12px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 16px}
.bar .count{color:var(--mute);font-size:14px}
.mem{background:#fff;border-radius:24px;padding:20px;margin-bottom:20px;box-shadow:0 8px 26px rgba(30,27,58,.08);border-top:10px solid var(--mc)}
.mh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.mh .id{display:flex;gap:12px;align-items:center}
.mh h2{margin:0;font-size:22px}
.meta{color:var(--mute);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
.chip{border-radius:14px;padding:8px 14px;font-weight:700;background:color-mix(in srgb,var(--mc) 14%,#fff);color:var(--mc)}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mc,var(--c1));border-radius:99px}
.logs{display:grid;gap:12px;margin-top:16px}
.log{border-radius:16px;padding:12px 16px;background:#faf9ff;border-left:6px solid var(--mc)}
.log h3{margin:0;font-size:17px}
.log p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.badge.done{background:#d5f7ef;color:#00806f}.badge.prog{background:#fff0cf;color:#a86a00}.badge.hrs{background:#e9e4ff;color:var(--c1)}
.acts{display:flex;gap:8px;margin-top:6px}
.att{max-width:220px;max-height:140px;border-radius:12px;border:2px solid var(--line);display:block;margin-top:6px}
.none{color:var(--mute);padding:6px 0}
.sum{background:#fff;border-radius:24px;padding:8px 20px;box-shadow:0 8px 26px rgba(30,27,58,.08)}
.row{display:grid;grid-template-columns:200px 1fr 190px;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .id{display:flex;gap:10px;align-items:center;font-weight:700}
.row .nums{font-size:13px;color:var(--mute);text-align:right}
.row .nums b{color:var(--ink);font-size:15px}
.hb{height:18px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}
.hb i{display:block;height:100%;border-radius:99px;background:var(--mc)}
.modal{position:fixed;inset:0;background:rgba(30,27,58,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.sheet{background:#fff;border-radius:24px;padding:26px;width:100%;max-width:520px;border-top:8px solid var(--c2)}
.sheet h2{margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;z-index:30;font-weight:600}
@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}.row{grid-template-columns:1fr}.row .nums{text-align:left}}
@media(max-width:560px){.two{grid-template-columns:1fr}}
@media print{body{background:#fff}header.top,.tabs,.filters,.bar,.acts,.addb{display:none!important}.mem,.sum,.stat{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
</style>
</head>
<body>

<section id="auth">
  <div class="authbox">
    <h1>Project Log Book</h1>
    <p id="authSub">Sign in with your IT number and password.</p>
    <form id="authForm" onsubmit="return false">
      <label for="aIt">IT number</label><input id="aIt" autocomplete="username" placeholder="ITxxxxxxxx">
      <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password">
      <div class="err" id="authErr" role="alert"></div>
      <button class="btn full" id="authBtn">Sign in</button>
    </form>
    <p id="firstRow" style="margin-top:14px;text-align:center"><span id="swText">First time here?</span> <button class="link" id="swBtn">Create your password</button></p>
    <div class="note hide" id="cfgNote">Firebase is not set up yet. Open this file and paste your Firebase config in the SETTINGS section at the top of the script.</div>
  </div>
</section>

<main id="app" class="wrap hide">
  <header class="top">
    <div><h1>Project Log Book</h1><p>Everyone’s work and progress in one place.</p></div>
    <div class="who"><div class="av" id="meAv"></div><b id="meName"></b><button class="btn sm" id="outBtn">Sign out</button></div>
  </header>

  <div class="team" id="team"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="all" aria-selected="true">All logs</button>
    <button class="tab" role="tab" data-tab="mine" aria-selected="false">My logs</button>
    <button class="tab" role="tab" data-tab="sum" aria-selected="false">Progress summary</button>
  </div>

  <div class="filters" id="filters">
    <div><label for="fq">Search</label><input id="fq" type="search" placeholder="Task or description"></div>
    <div><label for="fm">Member</label><select id="fm"></select></div>
    <div><label for="fs">Status</label><select id="fs"><option value="">Any status</option><option>Completed</option><option>In Progress</option></select></div>
    <div><label for="ff">From</label><input id="ff" type="date"></div>
    <div><label for="ft">To</label><input id="ft" type="date"></div>
  </div>

  <div class="bar">
    <span class="count" id="count"></span>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost sm" id="clrBtn">Clear filters</button>
      <button class="btn teal sm" id="csvBtn">Download report</button>
      <button class="btn ghost sm" id="prBtn">Print</button>
      <button class="btn sm addb" id="addTop">Add new log</button>
    </div>
  </div>

  <section id="view"></section>
</main>

<div class="modal hide" id="modal"><div class="sheet">
  <h2 id="mTitle">Add new log</h2>
  <form id="logForm" onsubmit="return false">
    <label for="lTask">Task title</label><input id="lTask" required maxlength="120">
    <label for="lDesc">What did you do?</label><textarea id="lDesc" required maxlength="1500"></textarea>
    <div class="two">
      <div><label for="lDate">Date</label><input id="lDate" type="date" required></div>
      <div><label for="lHrs">Hours spent</label><input id="lHrs" type="number" min="0.25" max="24" step="0.25" required></div>
    </div>
    <label for="lStat">Work status</label><select id="lStat"><option>Completed</option><option>In Progress</option></select>
    <label for="lFile">Screenshot or document (images are shrunk automatically)</label><input id="lFile" type="file" accept="image/*,.pdf,.txt">
    <div class="err" id="fErr" role="alert"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn" id="mSave">Submit log</button>
    </div>
  </form>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, where, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================================
   SETTINGS: edit this part whenever you need to
   ===================================================================== */

// 1) Your Firebase keys (Firebase Console > Project settings > Your apps > Web app)
const firebaseConfig = {
  apiKey: "AIzaSyAN7aflvfryBh37GEH7LZz2E-hyHKkX6jw",
    authDomain: "logbook-b77f0.firebaseapp.com",
    projectId: "logbook-b77f0",
    appId: "1:165090699266:web:f105638b2e92969e1cdf1b"
};

// 2) The 5 members: "IT number": "Name shown on the page". Every IT number must be different.
const MEMBERS = {
 "IT26101283": "Jayawardhana R.S.U",
  "IT26101772": "Kumara H.L.M.A",
  "IT26101504": "Uthpala R.P.S",
  "IT26101368": "Ahamed M.N.H",
  "IT26102134": "Amarapala H.D.K.S"
};

// 3) Admins: these IT numbers can see and edit EVERY member's logs (they must also be in MEMBERS above).
const ADMINS = ["IT26101283", "IT26101772"];
// true = every member can see everyone's logs. false = normal members see only their own (admins always see all).
const MEMBERS_SEE_ALL = true;

// 4) true = members create their own password the first time. false = you add the accounts in Firebase Console.
const ALLOW_FIRST_TIME_SETUP = true;

/* ===================================================================== */

const EMAIL_DOMAIN = "logbook.local";
const CONFIGURED = !firebaseConfig.apiKey.startsWith("PASTE");
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAL = ["#6c4cf5","#ff5c8a","#00b8a9","#ff9a1f","#2f8cff","#e04bd8"];
const ids = Object.keys(MEMBERS);
const colorOf = it => PAL[Math.max(0, ids.indexOf(it)) % PAL.length];
const avatar = (n, it) => `<div class="av" style="background:${colorOf(it)}">${esc((n || "?").trim()[0].toUpperCase())}</div>`;
const today = () => new Date().toISOString().slice(0, 10);
const norm = v => v.replace(/\s+/g, "").toUpperCase();
const r2 = n => Math.round(n * 100) / 100;
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2300); };

let auth, db, col, me = null, logs = [], editing = null, attach = null, first = false, started = false, tab = "all";
if (CONFIGURED) { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); col = collection(db, "projectLogs"); }
else $("cfgNote").classList.remove("hide");
if (!ALLOW_FIRST_TIME_SETUP) $("firstRow").classList.add("hide");
$("fm").innerHTML = `<option value="">All members</option>` + ids.map(i => `<option value="${i}">${esc(MEMBERS[i])}</option>`).join("");

/* ---------- sign in ---------- */
function setMode(f) {
  first = f; $("authBtn").textContent = f ? "Create password" : "Sign in";
  $("authSub").textContent = f ? "Choose a password for your IT number (at least 6 characters)." : "Sign in with your IT number and password.";
  $("swText").textContent = f ? "Already have a password?" : "First time here?";
  $("swBtn").textContent = f ? "Sign in" : "Create your password"; $("authErr").textContent = "";
}
$("swBtn").onclick = () => setMode(!first);
const friendly = c => ({ "auth/invalid-credential": "Wrong IT number or password.", "auth/wrong-password": "Wrong IT number or password.", "auth/user-not-found": "No account yet. Use “Create your password” first.", "auth/email-already-in-use": "This IT number already has a password. Sign in instead.", "auth/weak-password": "Password must be at least 6 characters.", "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.", "auth/network-request-failed": "No internet connection." }[c] || "Could not sign in (" + c + ").");
$("authBtn").onclick = async () => {
  if (!CONFIGURED) return;
  const it = norm($("aIt").value), pw = $("aPass").value; $("authErr").textContent = "";
  if (!it || !pw) { $("authErr").textContent = "Enter your IT number and password."; return; }
  if (!MEMBERS[it]) { $("authErr").textContent = "This IT number is not allowed to use the Log Book."; return; }
  const email = it.toLowerCase() + "@" + EMAIL_DOMAIN; $("authBtn").disabled = true;
  try { first ? await createUserWithEmailAndPassword(auth, email, pw) : await signInWithEmailAndPassword(auth, email, pw); }
  catch (e) { $("authErr").textContent = friendly(e.code); }
  $("authBtn").disabled = false;
};
$("outBtn").onclick = () => signOut(auth);

if (CONFIGURED) onAuthStateChanged(auth, u => {
  const it = u ? norm(u.email.split("@")[0]) : null;
  if (u && !MEMBERS[it]) { signOut(auth); $("authErr").textContent = "This IT number is not allowed."; return; }
  me = u ? { uid: u.uid, it, name: MEMBERS[it], admin: ADMINS.includes(it) } : null;
  $("auth").classList.toggle("hide", !!u); $("app").classList.toggle("hide", !u);
  if (!u) return;
  $("meName").textContent = me.name + " (" + it + ")" + (me.admin ? " – Admin" : ""); $("meAv").outerHTML = avatar(me.name, it).replace('class="av"', 'class="av" id="meAv"');
  if (!started) { started = true; onSnapshot(me.admin || MEMBERS_SEE_ALL ? query(col) : query(col, where("userId", "==", me.uid)), s => { logs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || "")); render(); }, e => toast("Could not load logs: " + e.code)); }
  else render();
});

/* ---------- filters and tabs ---------- */
const filtered = () => {
  const q = $("fq").value.toLowerCase(), m = $("fm").value, s = $("fs").value, f = $("ff").value, t = $("ft").value;
  return logs.filter(l => (!q || (l.taskTitle + " " + l.description).toLowerCase().includes(q)) && (!m || l.itNumber === m) && (!s || l.status === s) && (!f || l.date >= f) && (!t || l.date <= t));
};
["fq", "fm", "fs", "ff", "ft"].forEach(i => $(i).addEventListener("input", render));
$("clrBtn").onclick = () => { ["fq", "fm", "fs", "ff", "ft"].forEach(i => $(i).value = ""); render(); };
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

/* ---------- page ---------- */
const vis = () => me.admin || MEMBERS_SEE_ALL ? ids : [me.it];
const stats = list => { const hrs = r2(list.reduce((a, l) => a + Number(l.hoursSpent || 0), 0)), done = list.filter(l => l.status === "Completed").length; return { n: list.length, hrs, done, open: list.length - done, pct: list.length ? Math.round(done / list.length * 100) : 0 }; };

function render() {
  if (!me) return;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  
  const t = stats(logs), list = filtered(), active = ids.filter(i => logs.some(l => l.itNumber === i)).length;
  $("team").innerHTML = [[t.n, "Total logs", "#6c4cf5"], [t.hrs, "Hours worked", "#ff5c8a"], [t.pct + "%", "Completed", "#00b8a9"], [active + " / " + ids.length, "Members active", "#ff9a1f"]].map(x => `<div class="stat" style="--sc:${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  $("count").textContent = list.length + " of " + logs.length + " logs shown";
  $("view").innerHTML = tab === "sum" ? summaryHtml(list) : membersHtml(list);
}

function membersHtml(list) {
  const order = tab === "mine" ? [me.it] : [me.it, ...vis().filter(i => i !== me.it)];
  const filtering = $("fq").value || $("fm").value || $("fs").value || $("ff").value || $("ft").value;
  return order.filter(it => !$("fm").value || it === $("fm").value).map(it => {
    const all = logs.filter(l => l.itNumber === it), shown = list.filter(l => l.itNumber === it), s = stats(all), mine = it === me.it, name = MEMBERS[it];
    return `<section class="mem" style="--mc:${colorOf(it)}">
      <div class="mh"><div class="id">${avatar(name, it)}<div><h2>${esc(name)}${mine ? " (you)" : ""}${ADMINS.includes(it) ? " <span class=\"badge hrs\">Admin</span>" : ""}</h2><span class="meta">${esc(it)}</span></div></div></div>
      <div class="chips"><div class="chip">${s.n}<small>Logs</small></div><div class="chip">${s.hrs}<small>Hours worked</small></div><div class="chip">${s.pct}%<small>Completed</small></div></div>
      <div class="prog" title="${s.pct}% of logs completed"><i style="width:${s.pct}%"></i></div>
      <div class="logs">${shown.length ? shown.map(l => logHtml(l, mine)).join("") : `<div class="none">${filtering && all.length ? "No logs match your filters." : mine ? "You have not added any work yet. Click “Add new log”." : "No work logged yet."}</div>`}</div></section>`;
  }).join("");
}

function summaryHtml(list) {
  const rows = vis().map(it => ({ it, s: stats(list.filter(l => l.itNumber === it)), last: list.filter(l => l.itNumber === it).map(l => l.date).sort().pop() }));
  const max = Math.max(1, ...rows.map(r => r.s.hrs));
  return `<div class="sum">${rows.map(r => `<div class="row" style="--mc:${colorOf(r.it)}">
    <div class="id">${avatar(MEMBERS[r.it], r.it)}<div>${esc(MEMBERS[r.it])}<div class="meta">${r.last ? "Last update " + esc(r.last) : "No updates yet"}</div></div></div>
    <div><div class="hb" title="${r.s.hrs} hours"><i style="width:${r.s.hrs / max * 100}%"></i></div><div class="prog" title="${r.s.pct}% completed"><i style="width:${r.s.pct}%"></i></div></div>
    <div class="nums"><b>${r.s.hrs} h</b> across ${r.s.n} logs<br>${r.s.done} completed, ${r.s.open} in progress</div></div>`).join("")}</div>
    <p class="meta" style="margin-top:10px">Top bar: hours worked. Bottom bar: share of logs completed. Filters above apply to this summary.</p>`;
}

function logHtml(l, mine) {
  const a = l.attachment ? (String(l.attachment.data).startsWith("data:image") ? `<img class="att" src="${esc(l.attachment.data)}" alt="${esc(l.attachment.name)}">` : `<a href="${esc(l.attachment.data)}" download="${esc(l.attachment.name)}">${esc(l.attachment.name)}</a>`) : "";
  return `<article class="log"><h3>${esc(l.taskTitle)}</h3>
    <div class="meta"><span>${esc(l.date)}</span><span class="badge hrs">${esc(l.hoursSpent)} h</span><span class="badge ${l.status === "Completed" ? "done" : "prog"}">${esc(l.status)}</span></div>
    <p>${esc(l.description)}</p>${a}
    ${l.editedBy ? `<div class="meta">Last edited by ${esc(l.editedBy)}</div>` : ""}
    ${mine || me.admin ? `<div class="acts"><button class="btn sm ghost" data-e="${esc(l.id)}">Edit</button>${mine ? `<button class="btn sm danger" data-d="${esc(l.id)}">Delete</button>` : ""}</div>` : ""}</article>`;
}
$("view").onclick = async e => {
  const ed = e.target.closest("[data-e]"), de = e.target.closest("[data-d]");
  if (ed) openForm(logs.find(l => l.id === ed.dataset.e));
  if (de && confirm("Delete this log? This cannot be undone.")) { try { await deleteDoc(doc(db, "projectLogs", de.dataset.d)); toast("Log deleted"); } catch (x) { toast("Could not delete: " + x.code); } }
};

/* ---------- add / edit form (own logs only) ---------- */
$("addTop").onclick = () => openForm();
function openForm(l) {
  editing = l || null; attach = l && l.attachment || null; $("fErr").textContent = "";
  $("mTitle").textContent = l ? "Edit log" : "Add new log";
  $("lTask").value = l ? l.taskTitle : ""; $("lDesc").value = l ? l.description : ""; $("lDate").value = l ? l.date : today();
  $("lHrs").value = l ? l.hoursSpent : ""; $("lStat").value = l ? l.status : "Completed"; $("lFile").value = "";
  $("modal").classList.remove("hide"); $("lTask").focus();
}
const closeForm = () => $("modal").classList.add("hide");
$("mCancel").onclick = closeForm;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeForm(); });
const MAXCHARS = 850000; // Firestore documents are limited to 1 MiB, so attachments are kept under about 620 KB
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u); let sc = Math.min(1, 1600 / Math.max(img.width, img.height));
      for (let k = 0; k < 8; k++) {
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        for (const q of [.85, .7, .55]) { const d = c.toDataURL("image/jpeg", q); if (d.length <= MAXCHARS) return res(d); }
        sc *= .75;
      }
      rej("Could not shrink that image enough. Try a smaller one.");
    };
    img.onerror = () => rej("Could not read that image."); img.src = u;
  });
}
$("lFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return; $("fErr").textContent = ""; $("mSave").disabled = true;
  try {
    if (f.type.startsWith("image/") && f.type !== "image/gif" && f.type !== "image/svg+xml") {
      if (f.size > 15 * 1024 * 1024) throw "That image is over 15 MB.";
      attach = { name: f.name.replace(/\.\w+$/, "") + ".jpg", data: await compressImage(f) };
    } else {
      if (f.size > 650 * 1024) throw "Documents must be under 650 KB. Photos and screenshots can be any size, they are shrunk automatically.";
      attach = { name: f.name, data: await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }) };
    }
  } catch (x) { $("fErr").textContent = typeof x === "string" ? x : "Could not read that file."; e.target.value = ""; }
  $("mSave").disabled = false;
};
$("mSave").onclick = async () => {
  if (!$("logForm").reportValidity()) return;
  const d = { taskTitle: $("lTask").value.trim(), description: $("lDesc").value.trim(), date: $("lDate").value, hoursSpent: Number($("lHrs").value), status: $("lStat").value, attachment: attach };
  try {
    if (editing) await updateDoc(doc(db, "projectLogs", editing.id), { ...d, editedBy: me.name, editedByIt: me.it });
    else await addDoc(col, { ...d, userId: me.uid, itNumber: me.it, memberName: me.name, createdAt: serverTimestamp() });
    closeForm(); toast(editing ? "Log updated" : "Log submitted");
  } catch (x) { $("fErr").textContent = x.code === "permission-denied" ? "Permission denied. The Firestore rules do not allow this. Publish the rules from the bottom of this file and make sure your IT number is in them." : "Could not save: " + (x.code || x.message); }
};

/* ---------- report (uses the current filters) ---------- */
$("prBtn").onclick = () => window.print();
$("csvBtn").onclick = () => {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = [["IT number", "Member", "Date", "Task", "Description", "Status", "Hours"]].concat(filtered().map(l => [l.itNumber, MEMBERS[l.itNumber] || l.memberName, l.date, l.taskTitle, l.description, l.status, l.hoursSpent]));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" }));
  a.download = "project-log-report-" + today() + ".csv"; a.click(); URL.revokeObjectURL(a.href);
};
</script>

<!--
FIRESTORE RULES: Firebase Console > Firestore Database > Rules > paste > Publish.
Replace the emails with your real IT numbers in lowercase + @logbook.local. The first 2 emails in admin() are the admins.
Normal members: read all, add and edit/delete their own. Admins: read all and edit anyone's log.

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function email() { return request.auth.token.email; }
    function allowed() {
      return request.auth != null && email() in [
        "it26000001@logbook.local", "it26000002@logbook.local", "it26000003@logbook.local",
        "it26000004@logbook.local", "it26000005@logbook.local" ];
    }
    function admin() {
      return request.auth != null && email() in [ "it26000001@logbook.local", "it26000002@logbook.local" ];
    }
    function mine() { return resource.data.userId == request.auth.uid; }
    match /projectLogs/{id} {
      allow read: if allowed();
      // If you set MEMBERS_SEE_ALL = false, use this instead:
      // allow read: if allowed() && (admin() || mine());
      allow create: if allowed() && request.resource.data.userId == request.auth.uid
        && request.resource.data.itNumber.lower() == email().split("@")[0];
      allow update: if allowed() && (mine() || admin())
        && request.resource.data.userId == resource.data.userId
        && request.resource.data.itNumber == resource.data.itNumber;
      allow delete: if allowed() && mine();
    }
  }
}
